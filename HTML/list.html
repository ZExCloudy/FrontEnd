<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>

<body>
    <h1>List</h1>
    <h2>Unordered List</h2>
    <ul>
        <li>1,2,3,4,5</li>
        <li>1,2,3,4,5</li>
        <li>1,2,3,4,5</li>
        <li>1,2,3,4,5</li>
        <li>1,2,3,4,5</li>
    </ul>
    <h2>Ordered List</h2>
    <ol>
        <li>One</li>
        <li>Two</li>
        <li>Three</li>
    </ol>
    <li></li>
</body>

</html>
