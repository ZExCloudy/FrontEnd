<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 100%;
            border: 2px solid black;
            text-align: center;
            border-collapse: collapse;
            color: #FFF;

        }

        td,
        th {
            border: 100%;
            border: 2px solid black;
            border-collapse: collapse;

        }

        td {
            background-color: #515151;
        }

        th {
            background-color: #414141;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <th>Name</th>
            <th>Height</th>
            <th>Weight</th>
        </tr>
        <tr>
            <td>Pratham</td>
            <td>6.2</td>
            <td>93</td>
        </tr>
        <tr>
            <td>Sagar</td>
            <td>6.0</td>
            <td>50</td>
        </tr>
    </table>
</body>

</html>
